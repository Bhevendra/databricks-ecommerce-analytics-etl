resources:
  jobs:
    ecommerce_master_job:
      name: ecommerce_master_job
      job_cluster_key: etl_cluster
      tasks:
        - task_key: ingestion
          spark_python_task:
            python_file: "src/ingestion/ingest_retail_data.py"
        - task_key: bronze
          depends_on:
            - task_key: ingestion
          spark_python_task:
            python_file: "src/bronze/bronze_transform.py"
        - task_key: silver_customers
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: "src/silver/customers.py"
        - task_key: silver_sales
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: "src/silver/sales.py"
        - task_key: silver_sales_orders
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: "src/silver/sales_orders.py"
        - task_key: gold
          depends_on:
            - task_key: silver_customers
            - task_key: silver_sales
            - task_key: silver_sales_orders
          spark_python_task:
            python_file: "src/gold/gold_transform.py"
        - task_key: warehouse
          depends_on:
            - task_key: gold
          spark_python_task:
            python_file: "src/warehouse/warehouse_build.py"
